version: 2
updates:
  # 루트 멀티 프로젝트 빌드.
  # 버전이 gradle/libs.versions.toml (버전 카탈로그) 에 모여 있어서 루트만 보면 된다.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    # 모듈이 많아 PR 이 쏟아지지 않도록 minor/patch 는 하나로 묶는다.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # 루트 settings.gradle 에 포함되지 않은 독립 빌드.
  # 버전 카탈로그를 쓰지 않고 build.gradle.kts 에 버전을 직접 적는다.
  - package-ecosystem: "gradle"
    directory: "/mongodb-pagination/benchmark-kit/spring-benchmark"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
