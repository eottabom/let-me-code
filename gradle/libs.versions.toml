[versions]
# spring
spring-boot = "4.0.7"
spring-dependency-management = "1.1.7"
spring-cloud = "2025.1.2"
spring-grpc = "1.0.3"

# envoy / istio ext_authz
envoy-controlplane-api = "1.0.53"
proto-google-common-protos = "2.72.0"

# test
playwright = "1.54.0"
junit-jupiter = "5.11.4"

# jmh
jmh = "1.37"

# logging
logback = "1.5.8"
slf4j = "2.0.9"

# protobuf / grpc
protobuf = "4.28.2"
protoc = "3.25.0"
grpc = "1.56.0"
google-protobuf-plugin = "0.9.6"

# serialization
jackson = "2.15.0"

# http
okhttp = "4.9.3"
feign = "13.6"

# formatter / checkstyle
spring-javaformat = "0.0.47"
checkstyle = "10.21.4"

# etc
javax-annotation = "1.3.2"

[libraries]
# spring
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-resttestclient = { module = "org.springframework.boot:spring-boot-resttestclient" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-gateway-server-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }
spring-grpc-dependencies = { module = "org.springframework.grpc:spring-grpc-dependencies", version.ref = "spring-grpc" }
spring-grpc-spring-boot-starter = { module = "org.springframework.grpc:spring-grpc-spring-boot-starter" }
envoy-controlplane-api = { module = "io.envoyproxy.controlplane:api", version.ref = "envoy-controlplane-api" }
proto-google-common-protos = { module = "com.google.api.grpc:proto-google-common-protos", version.ref = "proto-google-common-protos" }

# h2
h2 = { module = "com.h2database:h2" }

# test
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }

# jmh
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }

# logging
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# protobuf / grpc
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }

# serialization
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# http
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
feign-core = { module = "io.github.openfeign:feign-core", version.ref = "feign" }
feign-hc5 = { module = "io.github.openfeign:feign-hc5", version.ref = "feign" }
feign-okhttp = { module = "io.github.openfeign:feign-okhttp", version.ref = "feign" }
feign-jackson = { module = "io.github.openfeign:feign-jackson", version.ref = "feign" }

# etc
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotation" }

# formatter
spring-javaformat-checkstyle = { module = "io.spring.javaformat:spring-javaformat-checkstyle", version.ref = "spring-javaformat" }

[plugins]
# spring
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spring-javaformat = { id = "io.spring.javaformat", version.ref = "spring-javaformat" }

# protobuf
google-protobuf = { id = "com.google.protobuf", version.ref = "google-protobuf-plugin" }
