# 시나리오 6. HTTP 외의 probe 종류
apiVersion: v1
kind: Pod
metadata:
  name: tcp-probe
  namespace: probes
spec:
  containers:
    - name: app
      image: probes-app:local
      imagePullPolicy: Never
      livenessProbe:
        tcpSocket: { port: 8080 }
        initialDelaySeconds: 10
        periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: exec-probe
  namespace: probes
spec:
  containers:
    - name: app
      image: probes-app:local
      imagePullPolicy: Never
      livenessProbe:
        exec:
          command: ["test", "-f", "/tmp/alive"]
        initialDelaySeconds: 15
        periodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: grpc-probe
  namespace: probes
spec:
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["grpc-health-checking"]
      ports:
        - containerPort: 5000
        - containerPort: 8080
      livenessProbe:
        grpc: { port: 5000 }
        periodSeconds: 5
