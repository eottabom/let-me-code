# x-request-id 를 누가 만드는지 보려고, ext_authz(HTTP) 를 붙인 Envoy 를 단독으로 띄운다.
# 인가 서버와 업스트림은 받은 요청을 그대로 돌려주는 echo 서버다.
static_resources:
  listeners:
  - name: ingress
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          route_config:
            virtual_hosts:
            - name: all
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: upstream }
          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              http_service:
                server_uri: { uri: "http://authz:8080", cluster: authz, timeout: 1s }
                # HTTP 서비스는 기본으로 Host, Method, Path, Content-Length, Authorization 만 넘기므로 직접 추가한다.
                authorization_request:
                  allowed_headers:
                    patterns: [ { exact: x-request-id }, { exact: x-demo-user } ]
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
  clusters:
  - name: authz
    type: STRICT_DNS
    load_assignment: { cluster_name: authz, endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: authz, port_value: 8080 } } } } ] } ] }
  - name: upstream
    type: STRICT_DNS
    load_assignment: { cluster_name: upstream, endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: upstream, port_value: 8080 } } } } ] } ] }
