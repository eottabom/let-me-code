# AS-IS: nginx(ALB) -> spring-cloud-gateway-demo(profile=authz) -> session-svc 검증 -> B 서버
server {
    listen 80;

    location = /api {
        proxy_pass http://gateway-authz:8090/api;
        proxy_set_header X-Demo-User $http_x_demo_user;
        proxy_set_header X-Request-Id $http_x_request_id;
    }
}
