# 클러스터 외부(Docker)의 A 컨테이너를 k8s Service 로 등록.
# HTTPRoute.backendRef 는 k8s Service 만 참조 가능하므로 ServiceEntry 대신 Service+Endpoints 조합을 사용한다.
# Endpoints 의 ip 는 run/lib.sh 의 resolve_host_ip 로 조회한 호스트(Mac) IP 로 run 스크립트가 치환한다 (${HOST_IP}).
apiVersion: v1
kind: Service
metadata:
  name: external-a
  namespace: istio-demo
spec:
  ports:
    - name: http
      port: 9000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-a
  namespace: istio-demo
subsets:
  - addresses:
      - ip: ${HOST_IP}
    ports:
      - name: http
        port: 9000
