# 클러스터 외부(Docker)의 B 컨테이너를 k8s Service 로 등록.
# Endpoints 의 ip 는 run/lib.sh 의 resolve_host_ip 로 조회한 호스트(Mac) IP 로 run 스크립트가 치환한다 (${HOST_IP}).
apiVersion: v1
kind: Service
metadata:
  name: external-b
  namespace: istio-demo-authz
spec:
  ports:
    - name: http
      port: 9000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-b
  namespace: istio-demo-authz
subsets:
  - addresses:
      - ip: ${HOST_IP}
    ports:
      - name: http
        port: 9000
